services:
  web:
    image: node:22
    container_name: aura-web
    working_dir: /workspace
    volumes:
      - ./jewelry:/workspace
      - aura_node_modules:/workspace/node_modules
    environment:
      - BASE44_PREVIEW_MODE=1
      - NODE_ENV=development
      # The platform sets this; Vite >= 6.1 appends it to allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: on-failure

volumes:
  aura_node_modules:
