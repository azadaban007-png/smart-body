services:
  web:
    build:
      context: ./website
      dockerfile: Dockerfile.base44
    labels:
      base44.project: "Shadi Ghader — Architecture & Interior Design"
      base44.kind: "web"
      base44.port: "3000"
    working_dir: /app
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-0}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
